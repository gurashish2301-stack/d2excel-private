<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D2Excel post A: hub and spoke</title>
<link rel="stylesheet" href="../brand.css">
<style>
  .a { background: var(--glow), var(--bg); color: var(--text); padding: 64px var(--margin) 52px; display: flex; flex-direction: column; }

  .head { position: relative; z-index: 2; }
  .kicker { font: 600 26px/1.2 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--kicker); margin-bottom: 16px; }
  .title { font: 650 80px/1.04 var(--font-sans); letter-spacing: -0.035em; text-wrap: balance; max-width: 960px; max-height: 2.14em; }
  .title .accent { color: var(--accent-word); }
  .stat { font: 400 32px/1.35 var(--font-sans); letter-spacing: -0.01em; color: var(--text-2); max-width: 940px; margin-top: 18px; text-wrap: pretty; }

  .body { position: relative; flex: 1; display: grid; grid-template-columns: 350px 1fr; align-items: center; margin: 16px 0 12px; }
  .spokes { position: absolute; inset: 0; width: 1200px; height: 100%; pointer-events: none; z-index: 0; }

  .hub { position: relative; z-index: 1; display: grid; place-items: center; width: 324px; }
  .rings { position: absolute; left: 50%; top: 50%; width: 1000px; height: 750px; transform: translate(-50%, -50%); pointer-events: none; }
  .hub-ring { position: relative; width: 324px; height: 324px; border-radius: 50%; border: 2px solid var(--plate-ring); display: grid; place-items: center; }
  .hub-plate { width: 276px; height: 276px; border-radius: 50%; background: var(--plate); display: grid; place-items: center; box-shadow: 0 20px 40px -18px rgb(0 0 0 / 0.5); }
  .hub-logo { width: 216px; }

  .rows { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; gap: 24px; }
  .row { display: grid; grid-template-columns: 108px 1fr; column-gap: 28px; align-items: start; }
  .node { width: 108px; height: 108px; border-radius: 50%; background: var(--red-600); color: #fff; display: grid; place-items: center; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.28); }
  .icon { width: 58px; height: 58px; fill: currentColor; }
  .row h2 { font: 640 40px/1.15 var(--font-sans); letter-spacing: -0.02em; margin-bottom: 8px; }
  .row p { font: 400 30px/1.36 var(--font-sans); color: var(--text-2); text-wrap: balance; }

  .tall .rows { justify-content: space-evenly; }
  .tall .stat { font-size: 36px; }
  .tall .row h2 { font-size: 44px; }
  .tall .row p { font-size: 33px; }
  .a .src { position: relative; z-index: 2; color: var(--text-3); max-width: 1072px; }
</style>
</head>
<body data-theme="dark">
<main class="slide a">
  <svg class="spokes" aria-hidden="true"></svg>

  <header class="head">
    <p class="kicker" data-f="kicker" data-min="24"></p>
    <h1 class="title" data-f="title" data-fit="52,80" data-min="48"></h1>
    <p class="stat" data-f="stat"></p>
  </header>

  <section class="body">
    <div class="hub">
      <svg class="rings" viewBox="-500 -375 1000 750" aria-hidden="true">
        <g fill="none" stroke="var(--ring)" stroke-width="2">
          <ellipse rx="236" ry="177" stroke-opacity="0.9"/>
          <ellipse rx="318" ry="239" stroke-opacity="0.65"/>
          <ellipse rx="400" ry="300" stroke-opacity="0.42"/>
          <ellipse rx="482" ry="361" stroke-opacity="0.24"/>
        </g>
      </svg>
      <div class="hub-ring"><div class="hub-plate"><img class="logo hub-logo" src="../assets/logo-tight.png" alt="D2Excel"></div></div>
    </div>
    <ol class="rows" data-each="spokes">
      <template>
        <li class="row">
          <span class="node"><svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><use data-icon="icon"></use></svg></span>
          <div><h2 data-f="heading"></h2><p data-f="body"></p></div>
        </li>
      </template>
    </ol>
  </section>

  <p class="src" data-f="source" data-min="24"></p>
</main>
<script src="../fill.js"></script>
<script>
  /* hub-and-spoke: draw one curved dashed line from the hub centre to each node, plus a dot where it leaves the ring */
  window.d2eLayout = () => {
    const NS = 'http://www.w3.org/2000/svg';
    const slide = document.querySelector('.slide').getBoundingClientRect();
    const svg = document.querySelector('.spokes');
    const box = document.querySelector('.body').getBoundingClientRect();
    svg.style.top = (box.top - slide.top) + 'px';
    svg.style.height = box.height + 'px';
    svg.setAttribute('viewBox', `0 0 1200 ${box.height}`);
    svg.replaceChildren();
    const c = document.querySelector('.hub-plate').getBoundingClientRect();
    const R = document.querySelector('.hub-ring').getBoundingClientRect().width / 2;
    const cx = c.left + c.width / 2 - slide.left, cy = c.top + c.height / 2 - box.top;
    document.querySelectorAll('.node').forEach(node => {
      const n = node.getBoundingClientRect();
      const nx = n.left + n.width / 2 - slide.left, ny = n.top + n.height / 2 - box.top;
      const dx = (nx - cx) * 0.55;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', `M${cx} ${cy} C${cx + dx} ${cy} ${nx - dx} ${ny} ${nx} ${ny}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'var(--line)');
      path.setAttribute('stroke-width', '3.5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-dasharray', '12 10');
      svg.append(path);
      const len = path.getTotalLength();
      let t = 0, p = path.getPointAtLength(0);
      while (t < len && Math.hypot(p.x - cx, p.y - cy) < R) { t += 2; p = path.getPointAtLength(t); }
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.setAttribute('r', '10');
      dot.setAttribute('fill', 'var(--red-600)');
      dot.setAttribute('stroke', 'var(--plate)'); dot.setAttribute('stroke-width', '3');
      svg.append(dot);
    });
  };
</script>
</body>
</html>
